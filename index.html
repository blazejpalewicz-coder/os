
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BeonlineOS</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #191a1e;
    color: #eee;
    font-family: Arial, sans-serif;
    height: 100vh;
    overflow: hidden;
}

/* TOP BAR */

.topbar {
    height: 38px;
    background: #222328;
    border-bottom: 1px solid #303137;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 17px;
    font-size: 12px;
    position: relative;
    z-index: 10;
}

.logo {
    font-weight: bold;
    letter-spacing: 1px;
}

.system-info {
    display: flex;
    gap: 17px;
    color: #aaa;
}

/* DESKTOP */

.desktop {
    height: calc(100vh - 38px);
    padding: 22px;
}

.desktop-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, 78px);
    grid-auto-rows: 82px;
    gap: 3px;
    width: fit-content;
}

.app {
    width: 78px;
    height: 82px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    border-radius: 6px;
    cursor: pointer;
    user-select: none;
}

.app:hover {
    background: #ffffff10;
}

.app-icon {
    width: 42px;
    height: 42px;
    background: #2b2d33;
    border: 1px solid #404249;
    border-radius: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 19px;
    color: #ddd;
}

.app-name {
    font-size: 10px;
    color: #d0d0d0;
    text-align: center;
}

/* TASKBAR */

.dock {
    position: fixed;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 6px 9px;
    height: 53px;
    background: #25272d;
    border: 1px solid #41434a;
    border-radius: 10px;
    box-shadow: 0 5px 25px #0005;
    transition: transform .25s, opacity .25s;
    z-index: 20;
}

.dock button {
    width: 39px;
    height: 39px;
    background: #34363d;
    border: none;
    border-radius: 7px;
    color: #ddd;
    font-size: 18px;
    cursor: pointer;
    position: relative;
}

.dock button:hover {
    background: #484b54;
}

/* APP LIBRARY BUTTON */

.library-button {
    font-size: 20px !important;
}

.dock-divider {
    width: 1px;
    height: 27px;
    background: #50525a;
    margin: 0 2px;
}

/* FIXED TASKBAR TOGGLE */

.dock-toggle {
    position: fixed;
    bottom: 2px;
    left: 50%;
    transform: translateX(-50%);
    width: 30px;
    height: 13px;
    background: #292b31;
    border: 1px solid #484a51;
    border-radius: 5px 5px 0 0;
    color: #ccc;
    font-size: 10px;
    line-height: 10px;
    cursor: pointer;
    z-index: 30;
    transition: background .2s;
}

.dock-toggle:hover {
    background: #484b54;
}

/* HIDDEN TASKBAR */

.dock.hidden {
    transform: translate(-50%, 90px);
    opacity: 0;
    pointer-events: none;
}

/* APP LIBRARY */

.library-overlay {
    position: fixed;
    inset: 38px 0 0;
    background: #101114eF;
    backdrop-filter: blur(15px);
    z-index: 15;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    visibility: hidden;
    transition: opacity .2s, visibility .2s;
}

.library-overlay.open {
    opacity: 1;
    visibility: visible;
}

.library {
    width: min(650px, 90vw);
    max-height: 80vh;
    overflow-y: auto;
    padding: 25px;
    transform: translateY(12px);
    transition: transform .2s;
}

.library-overlay.open .library {
    transform: translateY(0);
}

.library-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 25px;
}

.library-header h2 {
    font-size: 17px;
    font-weight: 500;
}

.library-close {
    border: none;
    background: #303239;
    color: white;
    border-radius: 6px;
    width: 30px;
    height: 30px;
    cursor: pointer;
    font-size: 18px;
}

.library-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
    gap: 15px;
}

.library .app {
    width: 100%;
    height: 100px;
}

.library .app-icon {
    width: 49px;
    height: 49px;
    font-size: 21px;
}

/* APPLICATION WINDOWS */

.window {
    display: none;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: min(480px, 90vw);
    min-height: 180px;
    background: #24262c;
    border: 1px solid #45474f;
    border-radius: 9px;
    box-shadow: 0 15px 60px #0009;
    overflow: hidden;
    z-index: 40;
}

.window-header {
    height: 40px;
    padding: 0 13px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #393b42;
    font-size: 12px;
}

.window-close {
    background: none;
    border: none;
    color: #aaa;
    font-size: 20px;
    cursor: pointer;
}

.window-content {
    padding: 35px 20px;
    text-align: center;
}

.window-content h2 {
    font-size: 17px;
    margin-bottom: 12px;
}

.window-content p {
    color: #999da6;
    font-size: 12px;
}

@media(max-width: 500px) {
    .desktop { padding: 12px; }
    .desktop-grid {
        grid-template-columns: repeat(4, 70px);
        grid-auto-rows: 78px;
    }
    .app { width: 70px; }
    .system-info { gap: 8px; }
}
</style>
</head>

<body>

<!-- TOP BAR -->

<header class="topbar">
    <div class="logo">◈ BOOS</div>
    <div class="system-info">
        <span>BeonlineOS</span>
        <span id="clock">00:00</span>
    </div>
</header>

<!-- DESKTOP -->

<main class="desktop">
    <section class="desktop-grid">

        <div class="app" onclick="openApp('Browser')">
            <div class="app-icon">◎</div>
            <span class="app-name">Browser</span>
        </div>

        <div class="app" onclick="openApp('Files')">
            <div class="app-icon">▤</div>
            <span class="app-name">Files</span>
        </div>

        <div class="app" onclick="openApp('Settings')">
            <div class="app-icon">⚙</div>
            <span class="app-name">Settings</span>
        </div>

    </section>
</main>

<!-- APP LIBRARY -->

<div class="library-overlay" id="libraryOverlay"
     onclick="if(event.target === this) closeLibrary()">

    <div class="library">

        <div class="library-header">
            <h2>Applications</h2>
            <button class="library-close" onclick="closeLibrary()">×</button>
        </div>

        <div class="library-grid">

            <div class="app" onclick="openApp('Browser')">
                <div class="app-icon">◎</div>
                <span class="app-name">Browser</span>
            </div>

            <div class="app" onclick="openApp('Files')">
                <div class="app-icon">▤</div>
                <span class="app-name">Files</span>
            </div>

            <div class="app" onclick="openApp('Settings')">
                <div class="app-icon">⚙</div>
                <span class="app-name">Settings</span>
            </div>

            <div class="app" onclick="openApp('Terminal')">
                <div class="app-icon">⌘</div>
                <span class="app-name">Terminal</span>
            </div>

            <div class="app" onclick="openApp('Notes')">
                <div class="app-icon">▧</div>
                <span class="app-name">Notes</span>
            </div>

            <div class="app" onclick="openApp('Calendar')">
                <div class="app-icon">▦</div>
                <span class="app-name">Calendar</span>
            </div>

            <div class="app" onclick="openApp('App Store')">
                <div class="app-icon">▣</div>
                <span class="app-name">App Store</span>
            </div>

            <div class="app" onclick="openApp('System Monitor')">
                <div class="app-icon">⌁</div>
                <span class="app-name">Monitor</span>
            </div>

            <div class="app" onclick="openApp('Calculator')">
                <div class="app-icon">⊞</div>
                <span class="app-name">Calculator</span>
            </div>

            <div class="app" onclick="openApp('Photos')">
                <div class="app-icon">▧</div>
                <span class="app-name">Photos</span>
            </div>

            <div class="app" onclick="openApp('Music')">
                <div class="app-icon">♫</div>
                <span class="app-name">Music</span>
            </div>

            <div class="app" onclick="openApp('About BOOS')">
                <div class="app-icon">◈</div>
                <span class="app-name">About BOOS</span>
            </div>

        </div>
    </div>
</div>

<!-- APPLICATION WINDOW -->

<div class="window" id="window">
    <div class="window-header">
        <span id="windowTitle">Application</span>
        <button class="window-close" onclick="closeApp()">×</button>
    </div>

    <div class="window-content">
        <h2 id="appName">Application</h2>
        <p>Application under development.</p>
    </div>
</div>

<!-- TASKBAR -->

<nav class="dock" id="dock">

    <button onclick="openApp('Browser')" title="Browser">◎</button>

    <button onclick="openApp('Files')" title="Files">▤</button>

    <button class="library-button"
            onclick="toggleLibrary()"
            title="Applications">⊞</button>

    <div class="dock-divider"></div>

    <button onclick="openApp('Settings')" title="Settings">⚙</button>

</nav>

<!-- ALWAYS VISIBLE TOGGLE -->

<button class="dock-toggle" id="dockToggle"
        onclick="toggleDock()" title="Show or hide taskbar">⌄</button>

<script>

// APPLICATION WINDOWS

function openApp(name) {
    closeLibrary();

    document.getElementById("window").style.display = "block";
    document.getElementById("windowTitle").textContent = name;
    document.getElementById("appName").textContent = name;
}

function closeApp() {
    document.getElementById("window").style.display = "none";
}

// TASKBAR TOGGLE

function toggleDock() {
    const dock = document.getElementById("dock");
    const toggle = document.getElementById("dockToggle");

    const hidden = dock.classList.toggle("hidden");

    toggle.textContent = hidden ? "⌃" : "⌄";
}

// APPLICATION LIBRARY

function toggleLibrary() {
    document.getElementById("libraryOverlay")
        .classList.toggle("open");
}

function closeLibrary() {
    document.getElementById("libraryOverlay")
        .classList.remove("open");
}

// CLOCK

function updateClock() {
    document.getElementById("clock").textContent =
        new Date().toLocaleTimeString([], {
            hour: "2-digit",
            minute: "2-digit"
        });
}

updateClock();
setInterval(updateClock, 1000);

// KEYBOARD SHORTCUTS

document.addEventListener("keydown", function(e) {
    if (e.key === "Escape") {
        closeLibrary();
        closeApp();
    }
});

</script>

</body>
</html>
